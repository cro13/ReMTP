<svg xmlns="http://www.w3.org/2000/svg" width="800" height="606" viewBox="0 0 800 606" role="img" aria-labelledby="t d">
<title id="t">ReMTP uploads 1,000 small files 19.4× faster than OpenMTP’s engine (Astell&amp;Kern SP3000, USB 3.2 Gen 1)</title>
<desc id="d">1,000 × 1 MB upload: ReMTP 19.4× faster. ReMTP: 44.6 s, 22.4 MB/s. OpenMTP 3.3.0 engine: 863.4 s (14 min 23 s), 1.2 MB/s. 100 × 30 MB upload (mean of 2 runs): ReMTP 1.5× faster. ReMTP: 21.0 s, 142.9 MB/s. OpenMTP 3.3.0 engine: 32.2 s, 93.2 MB/s. 2 × 1.5 GB upload: ReMTP 1.6× faster. ReMTP: 13.0 s, 230.8 MB/s. OpenMTP 3.3.0 engine: 20.4 s, 147.0 MB/s. 100 × 30 MB download: ReMTP 1.3× faster. ReMTP: 16.5 s, 181.9 MB/s. OpenMTP 3.3.0 engine: 21.5 s, 139.8 MB/s. 100 × 30 MB upload: mean of the runs (ReMTP 20.6 s, 21.4 s; OpenMTP 3.3.0 engine 31.1 s, 33.3 s). MB/s for a mean is the data size divided by the mean time. Method: ReMTP 0.1.0 release candidate (the initial public commit) vs go-mtpx@18f12db + go-mtpfs@1c3302b (the engine inside OpenMTP 3.3.0, run without its UI, with OpenMTP 3.3.0's bundled libusb). Mac Studio (M4 Max), macOS 27.2.1, random data, MB = 10^6 B. Details and raw tables: see docs/BENCHMARKS.md.</desc>
<style>
