<svg xmlns="http://www.w3.org/2000/svg" width="800" height="606" viewBox="0 0 800 606" role="img" aria-labelledby="t d">
<title id="t">ReMTP uploads 1,000 small files 12.4× faster than OpenMTP’s engine (Astell&amp;Kern SP3000, USB 3.2 Gen 1)</title>
<desc id="d">1,000 × 1 MB upload: ReMTP 12.4× faster. ReMTP: 45.2 s, 22.1 MB/s. OpenMTP 3.3.0 engine: 561.1 s (9 min 21 s), 1.8 MB/s. 100 × 30 MB upload (mean of 2 runs): ReMTP 1.8× faster. ReMTP: 21.3 s, 140.8 MB/s. OpenMTP 3.3.0 engine: 38.1 s, 78.7 MB/s. 2 × 1.5 GB upload: ReMTP 2.0× faster. ReMTP: 13.7 s, 219.5 MB/s. OpenMTP 3.3.0 engine: 27.8 s, 108.0 MB/s. 100 × 30 MB download: ReMTP 1.6× faster. ReMTP: 19.2 s, 156.0 MB/s. OpenMTP 3.3.0 engine: 30.1 s, 99.5 MB/s. 100 × 30 MB upload: mean of the runs (ReMTP 21.3 s, 21.3 s; OpenMTP 3.3.0 engine 39.8 s, 36.4 s). MB/s for a mean is the data size divided by the mean time. Method: ReMTP 0.1.0 pre-release (Nov 19 build, before the public history) vs go-mtpx@18f12db + go-mtpfs@1c3302b (the engine inside OpenMTP 3.3.0, run without its UI, with Homebrew libusb 1.0.30). iMac 2019 (Intel), macOS 15.8, random data, MB = 10^6 B. Details and raw tables: see docs/BENCHMARKS.md.</desc>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;font-variant-numeric:tabular-nums}
