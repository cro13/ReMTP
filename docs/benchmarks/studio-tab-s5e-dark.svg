<svg xmlns="http://www.w3.org/2000/svg" width="800" height="606" viewBox="0 0 800 606" role="img" aria-labelledby="t d">
<title id="t">ReMTP uploads 1,000 small files 21.5× faster than OpenMTP’s engine (Samsung Galaxy Tab S5e, USB 3.2 Gen 1)</title>
<desc id="d">1,000 × 1 MB upload: ReMTP 21.5× faster. ReMTP: 64.1 s, 15.6 MB/s. OpenMTP 3.3.0 engine: 1380.1 s (23 min), 0.7 MB/s. 100 × 30 MB upload (mean of 2 runs): ReMTP 3.9× faster. ReMTP: 44.1 s, 68.0 MB/s. OpenMTP 3.3.0 engine: 171.0 s (2 min 51 s), 17.5 MB/s. 2 × 1.5 GB upload: ReMTP 1.9× faster. ReMTP: 32.5 s, 92.4 MB/s. OpenMTP 3.3.0 engine: 60.8 s, 49.4 MB/s. 100 × 30 MB download: ReMTP 1.4× faster. ReMTP: 14.5 s, 207.1 MB/s. OpenMTP 3.3.0 engine: 20.2 s, 148.8 MB/s. 100 × 30 MB upload: mean of the runs (ReMTP 43.8 s, 44.4 s; OpenMTP 3.3.0 engine 171.9 s, 170.0 s). MB/s for a mean is the data size divided by the mean time. Method: ReMTP 0.1.0 release candidate (the initial public commit) vs go-mtpx@18f12db + go-mtpfs@1c3302b (the engine inside OpenMTP 3.3.0, run without its UI, with OpenMTP 3.3.0's bundled libusb). Mac Studio (M4 Max), macOS 27.2.1, random data, MB = 10^6 B. Details and raw tables: see docs/BENCHMARKS.md.</desc>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;font-variant-numeric:tabular-nums}
.title{font-size:19px;font-weight:600;fill:#f0efec}
.sub{font-size:13px;fill:#c3c2b7}
.legend{font-size:13px;fill:#f0efec}
.row{font-size:14px;font-weight:600;fill:#f0efec}
.speed{font-size:14px;font-weight:600;fill:#f0efec}
.series{font-size:12.5px;fill:#f0efec}
.series-note{font-size:11px;fill:#c3c2b7}
.value{font-size:13px;font-weight:600;fill:#f0efec}
.value-2{font-weight:400;fill:#c3c2b7}
.note{font-size:12.5px;font-style:italic;fill:#c3c2b7}
.foot{font-size:11.5px;fill:#c3c2b7}
.hair{stroke:#30363d;stroke-width:1}
.base{stroke:#6e7681;stroke-width:1}
.crit-stroke{fill:none;stroke:#d03b3b;stroke-width:1.75;stroke-linecap:round}
.s-remtp{fill:#3987e5}
.s-openmtp{fill:#d95926}
.s-openmtp_zlpfix{fill:#199e70}
</style>
