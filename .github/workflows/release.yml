name: Release

# Push a tag like v0.1.0 to build, sign and publish a release (macOS only for now). Tag runs need all
# of these repository secrets and fail before building without them:
#   MACOS_CERTIFICATE_P12_BASE64, MACOS_CERTIFICATE_PASSWORD   (Developer ID Application certificate)
#   NOTARY_KEY_ID, NOTARY_ISSUER_ID, NOTARY_KEY_P8_BASE64      (App Store Connect API key for notarytool)
# A manual run (workflow_dispatch) from a branch works without them: ad-hoc signed, not notarized, no
# release; the DMGs and tarballs are the run's artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cheap Linux check so a tag without signing secrets fails before any macOS minutes are spent.
  preflight:
    name: Check signing secrets
    runs-on: ubuntu-latest
    steps:
      - name: Require all signing secrets on tags
        env:
          HAS_MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}
          HAS_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD != '' }}
          HAS_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID != '' }}
          HAS_NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID != '' }}
          HAS_NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 != '' }}
        run: |
          missing=()
          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD NOTARY_KEY_ID NOTARY_ISSUER_ID NOTARY_KEY_P8_BASE64; do
            var="HAS_$name"
            [[ "${!var}" == true ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} -eq 0 ]]; then echo "All signing secrets are set."; exit 0; fi
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            echo "::error::Release tags must be signed and notarized. Missing secrets: ${missing[*]} (see docs/RELEASING.md)"
            exit 1
          fi
          echo "::warning::Missing secrets: ${missing[*]}. This run is not notarized (and ad-hoc signed without the certificate)."

  macos-build:
    name: macOS ${{ matrix.arch }} build
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Install toolchain and XcodeGen
        run: rustup toolchain install && brew install xcodegen
      - name: Build (no secrets)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          scripts/ci/build-macos.sh ${{ matrix.arch }} "$VERSION"
          tar -czf "unsigned-macos-${{ matrix.arch }}.tar.gz" -C build "macos-${{ matrix.arch }}/ReMTP.app" "macos-${{ matrix.arch }}/cli"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-macos-${{ matrix.arch }}
          path: unsigned-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  # Signing runs in a fresh job that only receives the build output, so build code never runs
  # next to the signing key or the notary credentials.
  macos-sign:
    name: macOS ${{ matrix.arch }} sign and package
    needs: macos-build
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    runs-on: macos-15
    env:
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-macos-${{ matrix.arch }}
      - name: Unpack build output
        run: mkdir -p build && tar -xzf "unsigned-macos-${{ matrix.arch }}.tar.gz" -C build
      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: scripts/ci/import-signing-cert.sh
      - name: Sign, notarize, package
        env:
          # Belt and braces with the preflight job: sign-macos.sh refuses to package a tag unsigned.
          REQUIRE_NOTARIZATION: ${{ github.ref_type == 'tag' && '1' || '' }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: scripts/ci/sign-macos.sh ${{ matrix.arch }} "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: macos-sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{macos-arm64,macos-x86_64}"
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      # Created as a draft and published only once every file is attached, so the release never goes
      # out (or becomes Latest) with downloads missing.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "ReMTP ${GITHUB_REF_NAME#v}"
      # A tag with a suffix, like v1.0.0-rc1, is published as a prerelease and never becomes Latest.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          else
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
