name: Screenshots

# Renders the app's own screens (design/app-shots.sh) from a Debug build with the demo backend and, when one of
# them changed, commits the new PNGs in design/screenshots/ to the branch it ran on. Runs when app code lands on
# main, or by hand from the Actions tab. The screens are pinned (demo clock, locale, a transfer on simulated
# time), so a commit means the app looks different, not that the clock moved.
on:
  push:
    branches: [main]
    paths:
      - apps/macos/**
      - design/app-shots.sh
      - scripts/ci/virtual-display.m
      - .github/workflows/screenshots.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  render:
    name: Render
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same key as CI's arm64 macos-app job, so a run on main reuses its cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: cargo-app-macos-15-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Install toolchain and XcodeGen
        run: rustup toolchain install && brew install xcodegen
      - name: Build Rust core and Swift bindings
        run: scripts/build-macos-core.sh --arch arm64
      - name: Build app
        working-directory: apps/macos
        run: |
          xcodegen generate
          xcodebuild -project ReMTP.xcodeproj -scheme ReMTP -configuration Debug \
            -destination "generic/platform=macOS" -derivedDataPath "$RUNNER_TEMP/dd" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
      # The runner's only screen is 1024 x 768 at 1x. A 2x virtual display gives the 1440 x 880 window room
      # and Retina pixels; the app moves its window to the sharpest screen and fails if it isn't 2x.
      - name: Render screenshots
        timeout-minutes: 15
        run: |
          clang -fobjc-arc -framework Foundation -framework CoreGraphics scripts/ci/virtual-display.m \
            -o "$RUNNER_TEMP/virtual-display"
          "$RUNNER_TEMP/virtual-display" 1600 1000 > "$RUNNER_TEMP/display.log" 2>&1 &
          display=$!
          for _ in $(seq 50); do grep -q '^ready' "$RUNNER_TEMP/display.log" && break; kill -0 $display || break; sleep 0.2; done
          cat "$RUNNER_TEMP/display.log"
          grep -q '^ready' "$RUNNER_TEMP/display.log" || { echo "::error::No 2x virtual display"; exit 1; }
          design/app-shots.sh "$RUNNER_TEMP/dd/Build/Products/Debug/ReMTP.app"
          kill $display
      - name: Compare with the committed screenshots
        id: compare
        run: |
          git status --short -- design/screenshots
          if [ -n "$(git status --porcelain -- design/screenshots)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "The screenshots haven't changed."
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: design/screenshots/*.png
          if-no-files-found: error

  # Separate from the build, so the key that can push never meets the app, its build scripts or dependencies.
  # It pushes with a deploy key (secret SCREENSHOTS_DEPLOY_KEY): main's "Codex review" ruleset lets deploy keys
  # through, and GitHub Actions can't be given that bypass on a personal repo. "[skip ci]" keeps the commit from
  # starting CI, as a push with the job's own token never did.
  commit:
    name: Commit
    needs: render
    if: needs.render.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          ssh-key: ${{ secrets.SCREENSHOTS_DEPLOY_KEY }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screenshots
          path: design/screenshots
      # On top of the branch's latest commit: a newer push that changed the app has its own run, which cancels
      # this one. A push without app changes leaves these screens current.
      - name: Commit and push
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design/screenshots
          if git diff --cached --quiet; then echo "Already up to date on $BRANCH."; exit 0; fi
          git diff --cached --stat
          git commit -q -m "Update app screenshots" -m "Rendered by the Screenshots workflow from $GITHUB_SHA." -m "[skip ci]"
          for attempt in 1 2 3; do
            git push origin "HEAD:$BRANCH" && exit 0
            sleep 5
            git pull --rebase -q origin "$BRANCH"
          done
          exit 1
