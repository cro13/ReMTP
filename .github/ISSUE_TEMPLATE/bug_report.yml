name: Bug report
description: Something doesn't work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect the device
        2. Copy 20 photos to Download
        3. …
  - type: input
    id: version
    attributes:
      label: ReMTP version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac and macOS version
      placeholder: MacBook Air M2, macOS 15.6
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Galaxy S23, Android 16
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or `remtp info` output
      description: Remove serial numbers (the device ID after the name can contain one), usernames and personal paths before posting.
      render: text
