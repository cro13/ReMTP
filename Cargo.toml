[workspace]
resolver = "3"
members = ["crates/remtp-core", "crates/remtp-cli", "crates/remtp-ffi", "crates/remtp-adb"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/cro13/ReMTP"
rust-version = "1.90"

# Direct dependencies are pinned exactly. Only add versions published at least 7 days ago.
[workspace.dependencies]
mtp-rs = "=0.38.1"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
futures = "=0.3.34"
bytes = "=1.12.1"
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
unicode-normalization = "=0.1.26"
clap = { version = "=4.6.7", features = ["derive"] }
uniffi = "=0.32.2"
# Already locked through mtp-rs; used directly for ADB interface detection and direct-USB ADB.
nusb = "=0.2.9"
# ReMTP's ADB key in the macOS Keychain (remtp-adb, macOS only).
security-framework = "=3.7.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
