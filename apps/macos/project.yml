# XcodeGen spec for the ReMTP macOS app. Generate with `xcodegen generate`; ReMTP.xcodeproj is git-ignored.
name: ReMTP
options:
  bundleIdPrefix: io.github.cro13
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  minimumXcodeGenVersion: "2.40.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  ReMTP:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ReMTP
      # Swift bindings generated by scripts/build-macos-core.sh (git-ignored).
      - path: Generated
    dependencies:
      # Rust core as a static library, built by scripts/build-macos-core.sh (git-ignored).
      - framework: Frameworks/RemtpFFI.xcframework
        embed: false
      - sdk: IOKit.framework
      - sdk: CoreFoundation.framework
      - sdk: libiconv.tbd
    settings:
      base:
        PRODUCT_NAME: ReMTP
        PRODUCT_BUNDLE_IDENTIFIER: io.github.cro13.ReMTP
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        # Merged with the generated keys: the exported pasteboard type for device rows.
        INFOPLIST_FILE: ReMTP/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: ReMTP
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 ReMTP contributors. MIT License."
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: "ReMTP shows and copies files in your Desktop folder."
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: "ReMTP shows and copies files in your Documents folder."
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: "ReMTP shows and copies files in your Downloads folder."
        INFOPLIST_KEY_NSRemovableVolumesUsageDescription: "ReMTP shows and copies files on removable volumes."
        INFOPLIST_KEY_NSNetworkVolumesUsageDescription: "ReMTP shows and copies files on network volumes."
        # Hardened runtime on; not sandboxed (USB access and launchctl for ptpcamerad).
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        # Ad-hoc signing for local builds; CI overrides with a Developer ID identity.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        DEAD_CODE_STRIPPING: YES
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          ONLY_ACTIVE_ARCH: YES
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
schemes:
  ReMTP:
    build:
      targets:
        ReMTP: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
